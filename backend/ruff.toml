line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
# FastAPI's Depends()/Query()/File() in argument defaults is the framework's
# documented style, not a mutable-default bug.
ignore = ["B008"]

[lint.per-file-ignores]
"alembic/versions/*" = ["E501"]  # generated-style DDL reads better unwrapped
