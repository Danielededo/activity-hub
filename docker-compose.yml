# Local stack: PostgreSQL, the API, and the dashboard behind nginx.
#
# The dashboard is the only thing published by default; it proxies /api to the
# backend on the compose network, so the browser makes same-origin requests and
# CORS never comes into it.
#
#   docker compose up --build
#   open http://localhost:8080
#
# The credentials below are local defaults. Override them with a .env file (see
# .env.example) before pointing this at anything that matters.

name: activity-hub

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-activity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-activity}
      POSTGRES_DB: ${POSTGRES_DB:-activity_hub}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Named explicitly: pg_isready defaults to the OS user, which is root here.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-activity} -d ${POSTGRES_DB:-activity_hub}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-activity}:${POSTGRES_PASSWORD:-activity}@postgres:5432/${POSTGRES_DB:-activity_hub}
      DISPLAY_TIMEZONE: ${DISPLAY_TIMEZONE:-Europe/Rome}
      # The dashboard proxies /api on its own origin, so no browser origin needs
      # allowing. Set this only if you call the API from somewhere else.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    depends_on:
      postgres:
        condition: service_healthy
    # Handy for API work; the dashboard does not need it published.
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      # The image is python:slim — no curl, so use the interpreter that is there.
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health',
          timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      API_URL: http://backend:8000/api/
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  pgdata:
