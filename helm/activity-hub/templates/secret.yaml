{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "activity-hub.fullname" . }}-database
  labels:
    {{- include "activity-hub.labels" . | nindent 4 }}
type: Opaque
stringData:
  # One URL, so the app has a single code path whether PostgreSQL is bundled
  # here or lives somewhere you manage.
  database-url: postgresql+psycopg2://{{ .Values.postgresql.auth.username }}:{{ include "activity-hub.postgresqlPassword" . }}@{{ include "activity-hub.postgresqlFullname" . }}:5432/{{ .Values.postgresql.auth.database }}
  postgres-password: {{ include "activity-hub.postgresqlPassword" . | quote }}
{{- end }}
