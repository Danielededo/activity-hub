apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "activity-hub.fullname" . }}-api
  labels:
    {{- include "activity-hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "activity-hub.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "activity-hub.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        # Restart the pods when the settings change, not just when the image does.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "activity-hub.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        # Migrations run here rather than in the app command, so the API never
        # serves against a schema it has not applied. This is why the API is a
        # single replica by default: two pods starting together would race.
        # Raising api.replicaCount means moving this to a Job with a pre-upgrade
        # hook instead.
        - name: migrate
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          command: ["alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "activity-hub.databaseSecretName" . }}
                  key: {{ include "activity-hub.databaseSecretKey" . }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          # The image's own command migrates and then serves; migrations are the
          # init container's job here, so serve only.
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: {{ include "activity-hub.fullname" . }}-api
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "activity-hub.databaseSecretName" . }}
                  key: {{ include "activity-hub.databaseSecretKey" . }}
          # Readiness checks the database, so a pod with no database stops
          # taking traffic. Liveness deliberately does not: a database blip
          # should not restart an otherwise healthy process.
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
