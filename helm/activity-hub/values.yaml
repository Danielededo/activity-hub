# Images. Nothing publishes these yet, so build and push them yourself, or load
# them into a local cluster (kind load / minikube image load) and keep
# pullPolicy at IfNotPresent.
api:
  image:
    repository: activity-hub-api
    tag: ""            # defaults to .Chart.AppVersion
    pullPolicy: IfNotPresent
  # One replica on purpose: migrations run in an init container, and two pods
  # starting together would race on them. Raising this means moving the
  # migration to a Job — see templates/backend-deployment.yaml.
  replicaCount: 1
  service:
    port: 8000
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 512Mi
  # Verbose SQL echo. Never in production: it logs data, not just statements.
  debug: false
  # IANA zone used to bucket activities whose file states no UTC offset.
  displayTimezone: UTC
  maxUploadBytes: 20971520

web:
  image:
    repository: activity-hub-web
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

# A single-replica PostgreSQL with a volume, so `helm install` gives a working
# app. Turn it off and point externalDatabase at something you back up if this
# holds training you care about.
postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  auth:
    username: activity
    database: activity_hub
    # No default: an unset password would either fail confusingly or, worse,
    # be guessable. Set it, or point existingSecret at one you already have.
    password: ""
    existingSecret: ""
    existingSecretPasswordKey: password
  persistence:
    enabled: true
    size: 8Gi
    storageClass: ""
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi

# Used when postgresql.enabled is false. The secret must hold a full SQLAlchemy
# URL, e.g. postgresql+psycopg2://user:pass@host:5432/activity_hub
externalDatabase:
  existingSecret: ""
  existingSecretKey: database-url

ingress:
  enabled: false
  className: ""
  annotations: {}
    # nginx.ingress.kubernetes.io/proxy-body-size: 24m
  host: activity-hub.local
  tls: []
    # - secretName: activity-hub-tls
    #   hosts: [activity-hub.local]

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

nameOverride: ""
fullnameOverride: ""
nodeSelector: {}
tolerations: []
affinity: {}
